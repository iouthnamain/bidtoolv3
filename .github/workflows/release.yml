name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing stable release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

# Release and rollback share this lock, including time awaiting environment approval.
concurrency:
  group: bidtool-production-delivery
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.source.outputs.version }}
      release_tag: ${{ steps.source.outputs.release_tag }}
    steps:
      # Bootstrap only; every check/build/delivery below checks out the resolved SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: bun run scripts/ci/source.ts resolve

  validate:
    needs: resolve
    uses: ./.github/workflows/validate.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      version: ${{ needs.resolve.outputs.version }}

  desktop:
    needs: [resolve, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            metadata_platform: win
          - os: ubuntu-latest
            platform: linux
            metadata_platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      BIDTOOL_APP_VERSION: ${{ needs.resolve.outputs.version }}
      BIDTOOL_PACKAGE_VERSION: ${{ needs.resolve.outputs.version }}
      BIDTOOL_DEPLOYMENT_SURFACE: desktop-bundled
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun run scripts/ci/source.ts head
      - run: bun install --frozen-lockfile
      - name: Set desktop version metadata
        run: echo "BIDTOOL_BUILD_METADATA=${BIDTOOL_APP_VERSION}+desktop.${METADATA_PLATFORM}.${SOURCE_SHA:0:7}" >> "$GITHUB_ENV"
        env:
          METADATA_PLATFORM: ${{ matrix.metadata_platform }}
      - name: Build desktop with electron-builder filename substitutions
        run: |
          # The placeholders are expanded by electron-builder, not the shell.
          # shellcheck disable=SC2016
          bun run desktop:build --config.artifactName='bidtoolv3-${version}-${arch}.${ext}'
      - name: Verify staged files, installer and updater checksums
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bun run scripts/ci/artifacts.ts desktop dist-electron "$PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.platform }}
          path: |
            dist-electron/*.exe
            dist-electron/*.AppImage
            dist-electron/*.blockmap
            dist-electron/latest*.yml
            dist-electron/*-evidence.json
          if-no-files-found: error

  verify-artifacts:
    needs: [resolve, validate, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      BIDTOOL_APP_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: runtime-image
          path: image
      - run: bun run scripts/ci/source.ts head
      - run: bun run scripts/ci/artifacts.ts verify release-assets

  publish:
    needs: [resolve, verify-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    permissions:
      contents: write
      packages: write
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      BIDTOOL_APP_VERSION: ${{ needs.resolve.outputs.version }}
      BIDTOOL_PACKAGE_VERSION: ${{ needs.resolve.outputs.version }}
      BIDTOOL_DEPLOYMENT_SURFACE: web
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: docker/setup-buildx-action@v3
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: runtime-image
          path: image
      - name: Fail closed before publication and prepare web build
        run: |
          set -euo pipefail
          bash scripts/ci/production-env.sh
          bun run scripts/ci/source.ts assert
          bun run scripts/ci/artifacts.ts verify release-assets
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; assets will not be overwritten.' >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$BIDTOOL_APP_VERSION"
          echo "ONPREM_IMAGE=$image" >> "$GITHUB_ENV"
          echo "BIDTOOL_BUILD_METADATA=${BIDTOOL_APP_VERSION}+web.${SOURCE_SHA:0:7}" >> "$GITHUB_ENV"
          docker load --input image/runtime-image.tar
          test "$(docker image inspect bidtool-ci:candidate --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
      - name: Assemble Vercel output before publishing any artifact
        run: |
          set -euo pipefail
          bunx vercel@65.9.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          bunx vercel@65.9.0 build --prod --token="$VERCEL_TOKEN"
          test -s .vercel/output/config.json
          jq -e '.version == 3' .vercel/output/config.json
          test -d .vercel/output/functions
      - name: Publish the verified image without rebuilding
        run: |
          set -euo pipefail
          bun run scripts/ci/source.ts assert
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Stable version tags cannot be silently replaced by a rerun.
          if docker buildx imagetools inspect "$ONPREM_IMAGE" > /tmp/image-exists.log 2>&1; then
            echo 'Version image already exists; refusing replacement.' >&2
            exit 1
          elif ! grep -Eqi 'manifest unknown|not found' /tmp/image-exists.log; then
            cat /tmp/image-exists.log >&2
            exit 1
          fi
          docker tag bidtool-ci:candidate "$ONPREM_IMAGE"
          docker push "$ONPREM_IMAGE"
          digest=$(docker buildx imagetools inspect "$ONPREM_IMAGE" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "ONPREM_DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Deploy verified Vercel output
        run: |
          set -euo pipefail
          bun run scripts/ci/source.ts assert
          mkdir -p dist-release
          deployment_url=$(bunx vercel@65.9.0 deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" \
            --meta "bidtoolSourceSha=$SOURCE_SHA" --meta "bidtoolVersion=$BIDTOOL_APP_VERSION")
          [[ "$deployment_url" =~ ^https://[a-zA-Z0-9.-]+$ ]]
          bunx vercel@65.9.0 inspect "$deployment_url" --token="$VERCEL_TOKEN" --json | \
            jq '{id, url, readyState, meta: {bidtoolSourceSha: .meta.bidtoolSourceSha, bidtoolVersion: .meta.bidtoolVersion}}' \
            > dist-release/web-deployment.json
          bun run scripts/ci/metadata.ts release
      - name: Prepare reviewable pins proposal
        run: |
          cp releases/pins.json dist-release/pins.json
          bun run scripts/update-release-pins.ts --manifest dist-release/manifest.json \
            --manifest-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/manifest.json" \
            --pins dist-release/pins.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-pins-proposal
          path: dist-release/*.json
          if-no-files-found: error
      - name: Publish release without replacing existing assets
        run: |
          set -euo pipefail
          bun run scripts/ci/source.ts assert
          bun run scripts/ci/artifacts.ts verify release-assets
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f | sort)
          gh release create "$RELEASE_TAG" "${assets[@]}" dist-release/manifest.json \
            --verify-tag --target "$SOURCE_SHA" --title "BidTool v3 $RELEASE_TAG" --generate-notes
          # The mutable convenience tag moves only after the release was created.
          bun run scripts/ci/source.ts assert
          docker buildx imagetools create --tag "ghcr.io/${GITHUB_REPOSITORY,,}:latest" \
            "${ONPREM_IMAGE%:*}@$ONPREM_DIGEST"
