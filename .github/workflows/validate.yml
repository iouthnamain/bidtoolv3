name: Validate source and runtime

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: false
        default: "0.1.0"
        type: string

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      BIDTOOL_APP_VERSION: ${{ inputs.version }}
      BIDTOOL_PACKAGE_VERSION: ${{ inputs.version }}
      DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun run scripts/ci/source.ts head
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Validate current release metadata and CLI
        run: |
          bun run scripts/ci/metadata.ts fixture
          bun run scripts/generate-release-manifest.ts --input dist-release/manifest-input.json --output dist-release/manifest.json
          bun run scripts/release-cli.ts status
      - uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: dist-release/manifest.json
          if-no-files-found: error

  runtime:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      BIDTOOL_APP_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun run scripts/ci/source.ts head
      - run: bun install --frozen-lockfile
      - name: Validate production Compose without starting it
        run: docker compose --env-file deploy/onprem/.env.customer.example -f compose.production.yml config --quiet
      - name: Build assembled runtime image
        run: |
          set -euo pipefail
          metadata="${BIDTOOL_APP_VERSION}+onprem.${SOURCE_SHA:0:7}"
          echo "BIDTOOL_BUILD_METADATA=$metadata" >> "$GITHUB_ENV"
          docker build --tag bidtool-ci:candidate \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.version=$BIDTOOL_APP_VERSION" \
            --build-arg "BIDTOOL_APP_VERSION=$BIDTOOL_APP_VERSION" \
            --build-arg "BIDTOOL_BUILD_METADATA=$metadata" .
      - name: Isolated PostgreSQL migrations, runtime restart and HTTP liveness
        env:
          IMAGE_REF: bidtool-ci:candidate
        run: bash scripts/ci/image-smoke.sh
      - name: Save verified image and evidence
        run: |
          mkdir -p image
          docker save --output image/runtime-image.tar bidtool-ci:candidate
          bun run scripts/ci/artifacts.ts image image
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-image
          path: image/*
          if-no-files-found: error
          retention-days: 3

  bundle:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      BIDTOOL_APP_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun run scripts/ci/source.ts head
      - run: bun install --frozen-lockfile
      - run: sh scripts/onprem-package-release.sh "$BIDTOOL_APP_VERSION"
      - run: bun run scripts/ci/artifacts.ts bundle dist-onprem
      - uses: actions/upload-artifact@v4
        with:
          name: assets-bundle
          path: |
            dist-onprem/*.tar.gz
            dist-onprem/bundle-evidence.json
          if-no-files-found: error
