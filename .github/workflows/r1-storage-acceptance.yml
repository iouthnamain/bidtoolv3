name: R1 storage acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  storage:
    name: Disposable Docker storage acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify tested commit and Docker tools
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          docker version
          docker compose version
      - name: Build disposable application image
        env:
          TEST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: docker build --tag "bidtool-r1-acceptance:$TEST_HEAD" .
      - name: Rehearse migration, replacement, download, restore and failure cases
        env:
          BIDTOOL_RUN_STORAGE_ACCEPTANCE: "1"
          BIDTOOL_STORAGE_TEST_IMAGE: bidtool-r1-acceptance:${{ github.event.pull_request.head.sha }}
        run: >-
          bun run test tests/fixtures/remediation/storage-acceptance.test.ts
          tests/fixtures/remediation/storage.test.ts tests/fixtures/remediation/restore.test.ts
          tests/data-root.test.ts tests/desktop-data-root.test.ts tests/storage-consumers.test.ts
      - name: Remove owned image
        if: always()
        env:
          TEST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: docker image rm "bidtool-r1-acceptance:$TEST_HEAD" || true
