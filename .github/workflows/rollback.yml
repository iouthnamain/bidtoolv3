name: Rollback

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "Reviewed pinned version to promote, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bidtool-production-delivery
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: write
      actions: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: docker/setup-buildx-action@v3
      - run: bun install --frozen-lockfile
      - name: Validate reviewed immutable image and explicit web state
        id: pin
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
        run: bun run scripts/ci/rollback-pin.ts
      - name: Preflight selected targets, promote and report each action
        env:
          VERSION: ${{ steps.pin.outputs.version }}
          SOURCE_REF: ${{ steps.pin.outputs.source_ref }}
          WEB_SKIPPED: ${{ steps.pin.outputs.web_skipped }}
          WEB_BUILD_ID: ${{ steps.pin.outputs.web_build_id }}
        run: bash scripts/ci/rollback.sh
