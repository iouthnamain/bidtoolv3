name: Rollback

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "Reviewed pinned version to promote, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bidtool-production-delivery
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: docker/setup-buildx-action@v3
      - run: bun install --frozen-lockfile
      - name: Validate reviewed immutable image and real web pin
        id: pin
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
        run: bun run scripts/ci/rollback-pin.ts
      - name: Preflight both targets before promotion
        env:
          SOURCE_REF: ${{ steps.pin.outputs.source_ref }}
          WEB_BUILD_ID: ${{ steps.pin.outputs.web_build_id }}
        run: |
          set -euo pipefail
          bash scripts/ci/production-env.sh
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools inspect "$SOURCE_REF"
          bunx vercel@65.9.0 inspect "$WEB_BUILD_ID" --token="$VERCEL_TOKEN" --json > /tmp/rollback-web.json
          jq -e --arg id "$WEB_BUILD_ID" '.id == $id and .readyState == "READY"' /tmp/rollback-web.json
      - name: Promote pinned web deployment
        env:
          WEB_BUILD_ID: ${{ steps.pin.outputs.web_build_id }}
        run: bunx vercel@65.9.0 promote "$WEB_BUILD_ID" --yes --token="$VERCEL_TOKEN"
      - name: Promote pinned image digest
        env:
          SOURCE_REF: ${{ steps.pin.outputs.source_ref }}
        run: docker buildx imagetools create --tag "ghcr.io/${GITHUB_REPOSITORY,,}:latest" "$SOURCE_REF"
      - name: Report limited rollback scope
        env:
          VERSION: ${{ steps.pin.outputs.version }}
          SOURCE_REF: ${{ steps.pin.outputs.source_ref }}
        run: |
          echo "Promoted artifact pins for $VERSION ($SOURCE_REF)." >> "$GITHUB_STEP_SUMMARY"
          echo 'No customer host, desktop installation, database or persisted bytes were rolled back.' >> "$GITHUB_STEP_SUMMARY"
