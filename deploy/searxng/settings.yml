use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "${SEARXNG_SECRET_KEY:-change-me}"
  limiter: true

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

ui:
  static_use_hash: true

outgoing:
  request_timeout: 6.0
  max_request_timeout: 8.0

engines:
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
    timeout: 6.0
  - name: duckduckgo
    disabled: false
  - name: google cse
    disabled: true
  - name: brave
    disabled: true
  - name: startpage
    disabled: true
